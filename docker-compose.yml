# 대구 혜택패스 전체 스택. 신뢰 도메인별 네트워크 격리:
#   net-issuer  : issuer ↔ chain            (발급기관은 원장에만 닿는다)
#   net-verifier: verifier ↔ chain          (검증기관은 원장에만 닿는다)
#   net-egress  : ai → LLM API              (외부로 나가는 유일한 서비스)
#   net-citizen : wallet / verifier-app     (정적 앱 컨테이너; 브라우저는 호스트 포트로 서비스에 접근한다)
# 시민 브라우저는 published 포트(localhost:8001/8002/8003/8004)로 서비스에 닿으므로 컨테이너끼리 공유 네트워크가 필요 없다.
# verifier 와 issuer 는 어떤 네트워크도 공유하지 않는다 → 발급기관 직접 조회 불가 (프롬프트 §2-5). `make demo-isolation` 이 이를 검사한다.
# (초기 토폴로지는 wallet 용 net-citizen 을 issuer·verifier 가 함께 써서 실제로는 닿았다 — 프로브가 잡아내 수정, DECISIONS D-20)
# 기본 체인은 Hardhat 노드. Besu QBFT 는 `docker compose --profile besu` (chain/besu 참고).
name: daegu-benefit-pass

x-python-base: &python-base
  build:
    context: .
    dockerfile: docker/python.Dockerfile
  environment: &python-env
    RPC_URL: http://chain:8545
    DEPLOYMENT_FILE: /app/chain/deployments/latest.json
    RULE_EVAL_DATE: "2026-09-14"
  volumes:
    - ./chain/deployments:/app/chain/deployments:ro

services:
  chain:
    build:
      context: .
      dockerfile: docker/chain.Dockerfile
    command: ["pnpm", "--config.verify-deps-before-run=false", "--filter", "@dbp/chain", "exec", "hardhat", "node", "--hostname", "0.0.0.0", "--port", "8545"]
    ports: ["8545:8545"]
    networks: [net-issuer, net-verifier, net-ops]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST -H 'content-type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_chainId\",\"params\":[]}' http://localhost:8545 >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

  deployer:
    build:
      context: .
      dockerfile: docker/chain.Dockerfile
    command: ["sh", "-c", "pnpm --config.verify-deps-before-run=false --filter @dbp/chain deploy:localhost && uv run python scripts/seed_ledger.py"]
    environment:
      RPC_URL: http://chain:8545
    volumes:
      - ./chain/deployments:/app/chain/deployments
    depends_on:
      chain: { condition: service_healthy }
    networks: [net-ops]

  issuer-daegu:
    <<: *python-base
    command: ["uv", "run", "python", "-m", "dbp_issuer"]
    environment:
      <<: *python-env
      ISSUER_ID: daegu
      ISSUER_PORT: "8001"
      ISSUER_DB_PATH: /data/issuer-daegu.db
    volumes:
      - ./chain/deployments:/app/chain/deployments:ro
      - issuer-daegu-data:/data
    ports: ["8001:8001"]
    depends_on:
      deployer: { condition: service_completed_successfully }
    networks: [net-issuer]

  issuer-welfare:
    <<: *python-base
    command: ["uv", "run", "python", "-m", "dbp_issuer"]
    environment:
      <<: *python-env
      ISSUER_ID: welfare
      ISSUER_PORT: "8003"
      ISSUER_DB_PATH: /data/issuer-welfare.db
    volumes:
      - ./chain/deployments:/app/chain/deployments:ro
      - issuer-welfare-data:/data
    ports: ["8003:8003"]
    depends_on:
      deployer: { condition: service_completed_successfully }
    networks: [net-issuer]

  verifier:
    <<: *python-base
    command: ["uv", "run", "python", "-m", "dbp_verifier"]
    environment:
      <<: *python-env
      VERIFIER_PORT: "8002"
      VERIFIER_PUBLIC_URL: http://localhost:8002
    ports: ["8002:8002"]
    depends_on:
      deployer: { condition: service_completed_successfully }
    networks: [net-verifier]   # ← 발급기관과 공유하는 네트워크가 없다: 원장(chain)에만 닿는다

  ai:
    <<: *python-base
    command: ["uv", "run", "python", "-m", "dbp_ai"]
    environment:
      AI_PORT: "8004"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
    volumes: []
    ports: ["8004:8004"]
    networks: [net-egress]     # LLM API 만 외부로; 원장·발급기관에는 닿지 않는다

  wallet:
    build:
      context: .
      dockerfile: docker/next.Dockerfile
      args: { APP: wallet }
    environment:
      NEXT_PUBLIC_ISSUER_DAEGU_URL: http://localhost:8001
      NEXT_PUBLIC_ISSUER_WELFARE_URL: http://localhost:8003
      NEXT_PUBLIC_VERIFIER_URL: http://localhost:8002
      NEXT_PUBLIC_AI_URL: http://localhost:8004
      NEXT_PUBLIC_RPC_URL: http://localhost:8545
    ports: ["3000:3000"]
    networks: [net-citizen]

  verifier-app:
    build:
      context: .
      dockerfile: docker/next.Dockerfile
      args: { APP: verifier }
    environment:
      NEXT_PUBLIC_VERIFIER_URL: http://localhost:8002
      NEXT_PUBLIC_RPC_URL: http://localhost:8545
    ports: ["3001:3000"]
    networks: [net-citizen]

networks:
  net-citizen: {}
  net-issuer: { internal: true }
  net-verifier: { internal: true }
  net-ops: { internal: true }
  net-egress: {}

volumes:
  issuer-daegu-data: {}
  issuer-welfare-data: {}
