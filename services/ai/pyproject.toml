[project]
name = "dbp-ai"
version = "0.1.0"
description = "대구 혜택패스 AI 서비스 — 규칙 엔진 결과를 설명만 하는 추천·상담 API (판정은 하지 않는다)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "anthropic>=1.0",
  "pydantic>=2",
  "dbp-rules",
]

[tool.uv.sources]
dbp-rules = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbp_ai"]
