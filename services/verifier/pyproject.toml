[project]
name = "dbp-verifier"
version = "0.1.0"
description = "대구 혜택패스 검증기관 서비스 (은행 창구·복지기관) — 원장만 조회, 발급기관에 묻지 않는다"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "dbp-rules",
  "dbp-vc",
  "dbp-ledger",
]

[tool.uv.sources]
dbp-rules = { workspace = true }
dbp-vc = { workspace = true }
dbp-ledger = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbp_verifier"]
