[project]
name = "daegu-benefit-pass"
version = "0.1.0"
description = "대구 혜택패스 — Python workspace"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.uv.workspace]
members = ["packages/*/py", "services/*"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "scripts"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
