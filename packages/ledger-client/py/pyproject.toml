[project]
name = "dbp-ledger"
version = "0.1.0"
description = "대구 혜택패스 공동원장 클라이언트 (web3.py) — 발급기관 레지스트리, 규칙 레지스트리, 상태목록, 영수증 앵커"
requires-python = ">=3.11"
dependencies = ["web3>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbp_ledger"]
