[project]
name = "dbp-vc"
version = "0.1.0"
description = "VC/VP 생성·서명·검증, did:key, JCS 해시, Bitstring Status List (TS @dbp/vc 와 동작 동일)"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43",
  "base58>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbp_vc"]
